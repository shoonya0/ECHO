# .github/workflows/verify.yml: runs the project's full check on every push to the
# default branch and on every pull request, on each target OS.
#
# Adapted for ECHO (Go): default branch main, Linux only (the server deploys to Render).
#
# Keep `on:` keys (push / pull_request / schedule / workflow_dispatch) at the top level.
# A key placed under `jobs:` makes GitHub reject the workflow, and every run then has 0 jobs.
# After the first push, confirm with: gh run list --workflow verify.yml  (expect jobs > 0)

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false # keep every OS leg running: shared vs platform-specific failures matter
      matrix:
        os: [ubuntu-latest] # e.g. [windows-latest, macos-latest] for desktop apps
    # MongoDB for the DB tests (internal/services/*_db_test.go). Same throwaway
    # credentials as docker/docker-compose.yml; TEST_DB_REQUIRED makes a missing DB
    # fail the run instead of skipping the tests. Redis is for the tests that use
    # testutil.UseTestRedis (the account check cache, #33); the same flag applies.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: echo
          MONGO_INITDB_ROOT_PASSWORD: echo
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DB_URI: mongodb://echo:echo@localhost:27017
      TEST_REDIS_URI: localhost:6379
      TEST_DB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # docs-check --base needs the base branch and the PR's commits

      # --- Docs tree (playbook 11): PRs only, once per run -----------------
      # Fails when the PR changes a feature's code without updating its state.md / tasks.md,
      # or adds an over-budget doc. Waive the stale check with [docs-skip] in a commit message.
      - name: docs-check (PR)
        if: github.event_name == 'pull_request' && strategy.job-index == 0
        run: node scripts/docs-check.mjs --strict --base origin/${{ github.base_ref }}

      # --- Go -------------------------------------------------------------
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: node scripts/verify.mjs --full

