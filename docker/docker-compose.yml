services:
  mongodb:
    image: mongo:7
    container_name: echo-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: echo
      MONGO_INITDB_ROOT_PASSWORD: echo
    # A one-node replica set, so multi-document transactions work as on Atlas (#37).
    # With auth on, a replica set needs a key file; one member only checks it against
    # itself, so a fresh random one per start is fine.
    entrypoint:
      - bash
      - -c
      - |
        mkdir -p /etc/mongo
        head -c 512 /dev/urandom | base64 -w 0 > /etc/mongo/keyfile
        chmod 400 /etc/mongo/keyfile && chown mongodb:mongodb /etc/mongo/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo/keyfile
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    # Initiates the replica set on the first check (a no-op afterwards) and is healthy
    # once this node is the primary. The member host is localhost:27017, the address
    # clients on the host (go run, tests, CI) use.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - -u
        - echo
        - -p
        - echo
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: echo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    name: echo_mongodb_data
  redis_data:
    name: echo_redis_data
